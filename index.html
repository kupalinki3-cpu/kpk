 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(playerX,H-29,43,7,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(playerX,H-76,39,0,Math.PI*2);ctx.clip();ctx.fillStyle='#eee';ctx.fillRect(playerX-40,H-116,80,80);if(profile.complete&&profile.naturalWidth)ctx.drawImage(profile,8,21,90,90,playerX-39,H-115,78,78);ctx.restore();ctx.strokeStyle='#272922';ctx.lineWidth=5;ctx.beginPath();ctx.arc(playerX,H-76,39,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#4db878';ctx.beginPath();ctx.arc(playerX+29,H-48,8,0,Math.PI*2);ctx.fill();if(flash>0){ctx.fillStyle=`rgba(170,40,25,${flash})`;ctx.fillRect(0,0,W,H);}}
function frame(t){const dt=Math.min((t-last)/1000||0,.04);last=t;step(dt);draw();requestAnimationFrame(frame);}
ui.start.addEventListener('click',()=>state==='paused'?pause():start());ui.pause.addEventListener('click',pause);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d',' ','r'].includes(k)){if(e.target.tagName==='BUTTON'&&(k===' '))return;e.preventDefault();if(!e.repeat&&k===' ')pause();else if(!e.repeat&&k==='r')start();else keys.add(k);}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
for(const [id,direction] of [['left',-1],['right',1]]){const button=document.getElementById(id);button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);held.set(e.pointerId,direction);});for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,e=>held.delete(e.pointerId));}
window.addEventListener('blur',()=>{clearInput();if(state==='playing')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause();});window.addEventListener('resize',resize);profile.onload=draw;stick.onload=draw;resize();requestAnimationFrame(frame);
</script>
